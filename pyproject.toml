[project]
name = "flightqa"
version = "0.1.0.dev0"
description = "UAV 다중분광 비행 데이터 품질 진단 도구 (MicaSense RedEdge-MX, DJI Mavic 3 Multispectral)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Seongjun Lee" }]
keywords = ["uav", "multispectral", "micasense", "dji", "quality-assurance", "exif"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# 상한은 다음 메이저 버전으로 고정한다 (CLAUDE.md §8). 올릴 때는 uv lock 재생성 + 테스트 통과 후.
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "pvlib>=0.12,<1",
  "jinja2>=3.1,<4",
  "plotly>=6.0,<7",
  "pyside6>=6.8,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "pyexiftool>=0.5.6,<1",
  "tifffile>=2025.1,<2027",
  "pypdf>=5.0,<7",
]

[project.scripts]
flightqa = "flightqa.cli:app"

[project.gui-scripts]
flightqa-gui = "flightqa.gui.app:main"

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "pytest-cov>=6.0,<8",
  "pandas-stubs>=2.2,<3",
  "types-shapely>=2.0,<3",
  "pyinstaller>=6.11,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightqa"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
cache-dir = "_out/cache/ruff"     # 생성물은 전부 _out/ 아래 (저장소 루트를 깨끗하게)
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "packaging"]
extend-exclude = ["tools", "packaging/flightqa.spec"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "N",         # pep8-naming
  "ANN",       # annotations (mypy --strict 와 짝)
  "RUF",       # ruff-specific
  "PTH",       # pathlib 사용 강제
  "C4",        # comprehensions
  "RET",       # return
  "ARG",       # unused arguments
  "T20",       # print 금지 (CLI/scripts 는 예외)
  "BLE",       # blind except 금지 (CLAUDE.md §8: 예외 삼키기 금지)
  "S110", "S112",  # try/except/pass, try/except/continue 금지
]
ignore = [
  "ANN401",    # Any 허용 (사용 시 사전 주석 규칙은 코드 리뷰로)
  "RUF001", "RUF002", "RUF003",  # 한글 주석/문자열의 유니코드 경고
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/bench/*" = ["T20"]
"packaging/*" = ["T20"]
"src/flightqa/cli.py" = ["T20"]
"tests/*" = ["S", "ARG"]
"src/flightqa/gui/**" = ["N802"]          # Qt 이벤트 오버라이드는 camelCase 가 계약
"src/flightqa/gui/theme/icons.py" = ["E501"]  # SVG 경로 데이터
"src/flightqa/gui/theme/qss.py" = ["E501"]    # QSS 한 줄 한 규칙

[tool.ruff.lint.isort]
known-first-party = ["flightqa"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
cache_dir = "_out/cache/mypy"
# numpy 2.x 스텁이 3.12 의 `type` 문을 쓰므로 3.11 로 검사하면 구문 오류가 난다 (런타임은 3.11 지원).
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts", "packaging"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pvlib.*", "plotly.*", "exiftool.*", "tifffile.*", "pytestqt.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
cache_dir = "_out/cache/pytest"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=flightqa --cov-report=term-missing:skip-covered"
qt_api = "pyside6"
faulthandler_timeout = 600  # 멈춘 테스트의 스택을 덤프 (거대 문자열 diff 등)
filterwarnings = [
  "ignore::DeprecationWarning:pvlib.*",  # numpy timedelta generic unit (pvlib 0.13 내부)
]
markers = [
  "exiftool: exiftool 바이너리가 필요한 테스트",
  "bench: 벤치마크 (기본 실행에서 제외)",
  "qt: QtWebEngine/Qt 오프스크린 렌더가 필요한 테스트",
]

[tool.coverage.run]
data_file = "_out/cache/.coverage"
source = ["flightqa"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
